baseURL = 'http://example.org/'
languageCode = 'zh-tw'
defaultContentLanguage = 'zh-tw'
title = 'My New Hugo Site'
theme = 'PaperMod'

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ['HTML', 'RSS', 'JSON'] # JSON 供站內搜尋使用

[params]
  env = 'production'
  description = '使用 Hugo + PaperMod 建立的部落格'
  author = 'Tom'
  defaultTheme = 'auto' # auto / light / dark
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false

  [params.homeInfoParams]
    Title = '哈囉 👋'
    Content = '歡迎來到我的部落格。'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

[[menus.main]]
  identifier = 'archives'
  name = '文章列表'
  url = '/archives/'
  weight = 10

[[menus.main]]
  identifier = 'tags'
  name = '標籤'
  url = '/tags/'
  weight = 20

[[menus.main]]
  identifier = 'search'
  name = '搜尋'
  url = '/search/'
  weight = 30

[markup.highlight]
  noClasses = false
